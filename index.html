<style>
/* Layout: Setkarten-Raster. Jede Person ist eine Comp-Card mit Hochformat-Foto links und Messwerten in Mono rechts. Filter klappen oben auf, Details und Formular öffnen als Sheet. */
:root{
  --bg:#fdfaee; --surface:#fffef9; --ink:#17130f; --muted:#675d49; --line:#d8ceb0; --chip:#f1e9cf;
  --accent:#9c5f00; --field:#8f8566; --accent-ink:#fffdf4; --danger:#a3262a; --ok:#1c7d45; --warn:#8a5300; --focus:#1f5fd6; --scrim:rgba(23,19,15,.55); --ok-ink:#ffffff;
  --logo-blend:normal; --logo-bg:transparent;
  --f-display:'Josefin Sans','Century Gothic','Trebuchet MS',Arial,sans-serif;
  --f-body:'Jost','Century Gothic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110d; --surface:#1e1a14; --ink:#f3ead2; --muted:#b3a68a; --line:#3a3326; --chip:#2a251c;
    --accent:#d9ac3e; --field:#7d7258; --accent-ink:#1a1408; --danger:#ff8a80; --ok:#6fcf97; --warn:#e7a23a; --focus:#e8c15f; --scrim:rgba(0,0,0,.68); --ok-ink:#08210f;
    --logo-blend:normal; --logo-bg:#fdfaee;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14110d; --surface:#1e1a14; --ink:#f3ead2; --muted:#b3a68a; --line:#3a3326; --chip:#2a251c;
  --accent:#d9ac3e; --field:#7d7258; --accent-ink:#1a1408; --danger:#ff8a80; --ok:#6fcf97; --warn:#e7a23a; --focus:#e8c15f; --scrim:rgba(0,0,0,.68); --ok-ink:#08210f;
  --logo-blend:normal; --logo-bg:#fdfaee;
  color-scheme:dark;
}
*{box-sizing:border-box}
a{color:var(--accent)}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1120px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}

.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;padding-block:22px 14px}
.top{border-bottom:3px double var(--accent);margin-bottom:2px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo-h{height:68px;width:auto;flex:none;display:block;mix-blend-mode:var(--logo-blend);background:var(--logo-bg);border-radius:8px}
.top h1{font-size:25px;line-height:1.05;text-transform:uppercase;letter-spacing:.09em}
.sub{margin:6px 0 0;color:var(--muted);font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.topact{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:12px;min-width:20px;padding:0 6px;text-align:center;font-family:var(--f-mono)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:40px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.tab{border:0;background:transparent;padding:9px 12px;font-weight:600;min-height:38px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sort{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:40px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.fr label,.fld label,.fl{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fr .u{text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-size:11px}
.pair{display:flex;gap:6px}
.pair input,.fr>input{min-width:0;width:100%}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{border:1px solid var(--field);background:var(--bg);border-radius:7px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:84px;resize:vertical}
.fg{margin-bottom:12px}
.hint{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:400;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:500;min-height:32px;display:inline-flex;align-items:center}
.chip.on,.chk input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{padding:0;position:relative;border:0;background:transparent}
.chk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chk span{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:5px 12px;min-height:32px;display:inline-flex;align-items:center;font-size:13.5px;font-weight:500}
.chk input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.ptools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}

.banner{margin-top:12px;border:1px dashed var(--warn);color:var(--ink);background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;margin-top:14px}
.card{display:flex;gap:14px;text-align:left;width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.card:hover{border-color:var(--muted)}
.ph{flex:none;width:76px;aspect-ratio:3/4;border-radius:6px;background:var(--chip);overflow:hidden;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ci{min-width:0;display:flex;flex-direction:column;gap:3px}
.cn{font-family:var(--f-display);font-size:23px;font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.cm{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.cl{font-size:13.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;margin-top:auto;padding-top:6px;font-size:12.5px}
.pill{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:12.5px;border:1px solid var(--ink);border-radius:4px;padding:0 6px}
.dot{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{color:var(--ok)}.dot.ok::before{background:var(--ok)}
.warn{color:var(--warn);font-weight:600}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:34px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:24px;margin-bottom:6px}
.empty .btn{margin-top:12px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}

.sh{position:sticky;top:0;background:var(--surface);display:flex;gap:10px;justify-content:space-between;align-items:center;padding-block:14px 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:14px}
.sh h2{font-size:26px;text-transform:uppercase;letter-spacing:.03em}

.dhead h2{font-size:34px;line-height:1;overflow-wrap:anywhere}
dl.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 16px;margin:0 0 14px}
dl.facts div{min-width:0}
dl.facts dt{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:12.5px;font-weight:600;color:var(--muted)}
dl.facts dd{margin:0;font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sec{margin-bottom:14px}
.sec h3{font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;font-weight:600}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-family:var(--f-mono);font-size:14px}
.copyrow span{user-select:all;overflow-wrap:anywhere;min-width:0}
.notes{white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
fieldset{border:0;padding:0;margin:0 0 18px;min-width:0}
legend{font-family:var(--f-display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0;margin-bottom:8px;color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cols.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.zoomable{border:0;padding:0;cursor:zoom-in;font:inherit}
.zoomable:hover{filter:brightness(.92)}
.lb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#222}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.ptile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.ptile .ph{width:100%;font-size:32px}
.pl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;font-weight:600;color:var(--muted)}
.pthumbs{display:flex;flex-wrap:wrap;gap:10px}
.pth{border:0;padding:0;background:none;cursor:zoom-in;text-align:left;width:84px;font:inherit;color:inherit}
.pth .ph{width:84px}
.pth span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.lbcap{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-family:var(--f-mono);font-size:13px;pointer-events:none}
.lbn{position:absolute;top:50%;transform:translateY(-50%);border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;width:44px;height:44px;font-size:26px;line-height:1}
.lbp{left:10px}.lbnx{right:10px}
.lb.single .lbn{display:none}
.cal{display:block;max-width:440px}
.calm{display:grid;gap:4px}
.calm+.calm{margin-top:16px;padding-top:12px;border-top:2px solid var(--line)}
.calt{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.05em;line-height:1.1;margin-bottom:2px}
.cd.gap{visibility:hidden}
.cd.we:not(.on){background:var(--chip)}
.calh,.calr{display:grid;grid-template-columns:42px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.calh span{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;color:var(--muted);text-align:center}
.kw{border:0;background:transparent;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:left;padding:0;min-height:38px}
.kw:not(:disabled){cursor:pointer}
.kw:hover:not(:disabled){color:var(--ink);text-decoration:underline}
.cd{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;min-height:42px;padding:2px 0 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cd small{font-family:var(--f-display);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.cd:not(:disabled){cursor:pointer}
.cd:hover:not(:disabled){border-color:var(--muted)}
.cd.on{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.cd.on small{color:inherit}
.cd.past{opacity:.35}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.calnote{margin:8px 0 0}
.ferr{color:var(--danger);font-weight:600;min-height:20px}
.pup{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.consent{display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.consent input{width:20px;height:20px;margin-top:2px;flex:none;min-height:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:calc(100% - 32px);font-weight:500}

.navtabs .tab{padding:9px 18px}

.pbar select{flex:1 1 240px;width:auto;min-width:0;min-height:40px}
.pj{display:block;width:100%;text-align:left;background:var(--surface,#fff);color:inherit;border:1px solid var(--line,#ddd);border-radius:10px;padding:12px 14px;margin-top:10px;cursor:pointer;font:inherit}

.pj h3{font-size:20px;line-height:1.15;margin:0 0 4px;overflow-wrap:anywhere}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.pcard h2{font-size:32px;line-height:1.05;overflow-wrap:anywhere}
.days{display:flex;flex-wrap:wrap;gap:6px}
.rolegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}

.mwrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.mwrap .btn{align-self:flex-start}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--ok);font-weight:500}
.score.part{color:var(--warn)}
.score.no{color:var(--muted)}
.edrow{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;background:var(--bg)}

.drow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}

.intro{margin:12px 0 0;color:var(--muted);max-width:68ch}
.selfwrap{max-width:760px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.okmsg{color:var(--ok);font-weight:600;margin:10px 0 0}
.kc{cursor:default}
.kc .ph{border:0;padding:0}
.sec .copyrow{margin-top:2px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.auth{max-width:520px;margin:0 auto;padding-block:28px}
.auth h1{font-size:34px;text-transform:uppercase;letter-spacing:.12em;line-height:1;text-align:center}
.auth .sub{text-align:center}
.logo-big{display:block;width:min(300px,78%);height:auto;margin:0 auto 14px;mix-blend-mode:var(--logo-blend);background:var(--logo-bg);border-radius:12px}
.auth .card2{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
.auth .fld{margin-bottom:12px}
.rolepick{display:grid;gap:8px;margin-bottom:12px}
.rolepick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.rolepick input{margin-top:3px;width:18px;height:18px;min-height:0;flex:none}
.rolepick b{display:block}
.subbox{margin:-2px 0 4px 28px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.foot{margin-top:24px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.foot a{color:inherit}
.demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.hint{border:1px solid var(--accent);background:var(--chip);border-radius:10px;padding:12px 14px}
.hint p{margin:0}

.plzrow{display:grid;grid-template-columns:110px 1fr;gap:12px;margin-top:12px}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle;flex:0 0 auto}
.msg{border-top:1px solid var(--line);margin-top:10px}
.msgh{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 0;font:inherit;color:inherit;cursor:pointer}

.msgh .dot{margin-left:0}

.msgb{padding:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}

const V = '10.14.1';
const base = 'https://www.gstatic.com/firebasejs/' + V + '/';

async function createFire(cfg) {
  const A = await import(base + 'firebase-app.js');
  const AU = await import(base + 'firebase-auth.js');
  const F = await import(base + 'firebase-firestore.js');
  const app = A.initializeApp(cfg);
  const auth = AU.getAuth(app);
  const fs = F.initializeFirestore(app, { ignoreUndefinedProperties: true });

  const snapDocs = (s) => s.docs.map((d) => ({ id: d.id, data: () => d.data() }));
  function wrapDoc(ref) {
    return {
      id: ref.id,
      get: async () => { const s = await F.getDoc(ref); return { exists: s.exists(), data: () => s.data() }; },
      set: (d) => F.setDoc(ref, d),
      update: (d) => F.updateDoc(ref, d),
      delete: () => F.deleteDoc(ref)
    };
  }
  function wrapColl(path, q) {
    const cref = F.collection(fs, path);
    const base = q || cref;
    return {
      doc: (id) => wrapDoc(id ? F.doc(fs, path, id) : F.doc(cref)),
      get: async () => ({ docs: snapDocs(await F.getDocs(base)) }),
      onSnapshot: (ok, err) => F.onSnapshot(base, (s) => ok({ docs: snapDocs(s) }), err),
      where: (f, op, v) => wrapColl(path, F.query(base, F.where(f, op, v)))
    };
  }
  const db = { collection: (p) => wrapColl(p), doc: (p) => wrapDoc(F.doc(fs, p)) };

  let pending = null;
  async function fetchInfo(u) {
    const s = await F.getDoc(F.doc(fs, 'users/' + u.uid));
    const d = s.exists() ? s.data() : null;
    return { uid: u.uid, email: u.email || '', name: (d && d.name) || '', role: (d && d.rolle) || null, reg: (d && d.reg) || null, freigabe: (d && d.freigabe) || null, gesperrt: !!(d && d.gesperrt), geloescht: !!(d && d.geloescht), loeschantrag: (d && d.loeschantrag) || null };
  }
  return {
    mode: 'firebase',
    db,
    onAuth(cb) {
      AU.onAuthStateChanged(auth, async (u) => {
        if (!u) { cb(null); return; }
        if (pending) { try { await pending; } catch (e) {} }
        try { cb(await fetchInfo(u)); } catch (e) { cb({ uid: u.uid, email: u.email || '', name: '', role: null, error: true }); }
      });
    },
    signIn: (email, pw) => AU.signInWithEmailAndPassword(auth, email, pw),
    async register(email, pw, name, role, reg) {
      let resolve;
      pending = new Promise((r) => { resolve = r; });
      try {
        const c = await AU.createUserWithEmailAndPassword(auth, email, pw);
        try {
          await F.setDoc(F.doc(fs, 'users/' + c.user.uid), Object.assign({ rolle: role, name: name, email: email, createdAt: Date.now() }, reg ? { reg: reg } : {}, role === 'kunde' ? { freigabe: 'offen' } : {}));
        } catch (e) {
          try { await c.user.delete(); } catch (_) {}
          throw e;
        }
      } finally { resolve(); pending = null; }
    },
    reset: (email) => AU.sendPasswordResetEmail(auth, email),
    signOut: () => AU.signOut(auth),
    async changePassword(oldPw, newPw) {
      const u = auth.currentUser;
      await AU.reauthenticateWithCredential(u, AU.EmailAuthProvider.credential(u.email, oldPw));
      await AU.updatePassword(u, newPw);
    },
    async deleteAccount() { if (auth.currentUser) await AU.deleteUser(auth.currentUser); }
  };
}

/* Prüfung von Telefonnummern und Postleitzahlen (gemeinsam für Anmeldung und Profile). */

/* Gibt '' zurück, wenn die Nummer in Ordnung ist, sonst den Fehlertext. */
function phoneCheck(v) {
  v = String(v == null ? '' : v).trim();
  if (!v) return 'Trage die Telefonnummer ein.';
  if (/[^0-9+\s()\/.\-]/.test(v)) return 'Die Telefonnummer darf nur Ziffern, Leerzeichen und + ( ) / - enthalten.';
  if (v.indexOf('+') > 0 || (v.match(/\+/g) || []).length > 1) return 'Das Pluszeichen steht nur ganz vorne, zum Beispiel +49 221 123456.';
  if (!/^(\+|0)/.test(v)) return 'Beginne mit der Vorwahl, zum Beispiel 0221 123456 oder +49 221 123456.';
  const d = v.replace(/\D/g, '');
  if (d.length < 6) return 'Die Telefonnummer ist zu kurz. Nimm mindestens 6 Ziffern.';
  if (d.length > 15) return 'Die Telefonnummer ist zu lang.';
  const rest = d.replace(/^0+/, '');
  if (rest.length < 5) return 'Das ist keine gültige Telefonnummer.';
  if (new Set(rest.split('')).size < 3) return 'Das ist keine gültige Telefonnummer.';
  const up = '01234567890123456789', down = '98765432109876543210';
  if (up.indexOf(rest) >= 0 || down.indexOf(rest) >= 0) return 'Das ist keine gültige Telefonnummer.';
  return '';
}

/* Format der Postleitzahl: 5 Ziffern (Deutschland) oder 4 Ziffern (Österreich, Schweiz). */
function plzFormat(v) {
  v = String(v == null ? '' : v).trim();
  if (!v) return 'Trage die Postleitzahl ein.';
  if (!/^\d{4,5}$/.test(v)) return 'Die Postleitzahl hat 4 oder 5 Ziffern.';
  return '';
}

const cache = {};

async function getJSON(url) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 5000);
  try {
    const r = await fetch(url, { signal: c.signal, headers: { Accept: 'application/json' } });
    if (r.status === 404) return { nf: true };
    if (!r.ok) return null;
    return { data: await r.json() };
  } catch (e) { return null; } finally { clearTimeout(t); }
}

async function lookupCountry(cc, plz) {
  let r = await getJSON('https://openplzapi.org/' + cc + '/Localities?postalCode=' + plz + '&pageSize=50');
  if (r && r.data) {
    const arr = Array.isArray(r.data) ? r.data : [];
    const names = Array.from(new Set(arr.map((x) => x && x.name).filter(Boolean)));
    return names.length ? { names } : { none: true };
  }
  r = await getJSON('https://api.zippopotam.us/' + cc + '/' + plz);
  if (r && r.data && Array.isArray(r.data.places)) {
    const names = Array.from(new Set(r.data.places.map((x) => x && x['place name']).filter(Boolean)));
    return names.length ? { names } : { none: true };
  }
  if (r && r.nf) return { none: true };
  return { unknown: true };
}

/* Ergebnis: {names:[…]} wenn es die PLZ gibt, {none:true} wenn es sie sicher nicht gibt, {unknown:true} wenn die Abfrage nicht möglich war. */
async function plzLookup(plz) {
  plz = String(plz || '').trim();
  if (!/^\d{4,5}$/.test(plz)) return { unknown: true };
  if (cache[plz]) return cache[plz];
  const ccs = plz.length === 5 ? ['de'] : ['at', 'ch'];
  const rs = await Promise.all(ccs.map((cc) => lookupCountry(cc, plz)));
  const names = Array.from(new Set([].concat(...rs.map((r) => r.names || []))));
  let res;
  if (names.length) res = { names };
  else if (rs.every((r) => r.none)) res = { none: true };
  else res = { unknown: true };
  if (!res.unknown) cache[plz] = res;
  return res;
}

/* Prüfung beim Absenden. '' = in Ordnung. Ist die Abfrage nicht möglich, wird nur das Format geprüft. */
async function plzGate(plz) {
  const f = plzFormat(plz);
  if (f) return f;
  const r = await plzLookup(plz);
  if (r.none) return 'Diese Postleitzahl gibt es nicht. Bitte prüfe sie.';
  return '';
}

/* Anzeige direkt beim Tippen: Stadt vorschlagen, Hinweis darunter. Felder tragen data-plz-ort / data-plz-from / data-plz-msg. */
function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }

function showFor(plzEl, ortEl, msgEl, res) {
  if (!msgEl) return;
  const ort = norm(ortEl && ortEl.value);
  let txt = '', bad = false;
  if (res && res.none) { txt = 'Diese Postleitzahl gibt es nicht.'; bad = true; }
  else if (res && res.names && ort && !res.names.some((n) => norm(n).indexOf(ort) >= 0 || ort.indexOf(norm(n)) >= 0)) {
    txt = 'Zu dieser Postleitzahl gehört: ' + res.names.slice(0, 3).join(', ') + '. Du kannst auch eine andere Stadt angeben.';
  }
  msgEl.textContent = txt;
  msgEl.style.color = bad ? 'var(--danger)' : '';
}

async function plzTick(plzEl) {
  const ortEl = document.getElementById(plzEl.dataset.plzOrt);
  const msgEl = plzEl.dataset.plzMsg ? document.getElementById(plzEl.dataset.plzMsg) : null;
  const v = plzEl.value.trim();
  if (!/^\d{4,5}$/.test(v)) { plzEl._res = null; if (msgEl) { msgEl.textContent = ''; msgEl.style.color = ''; } return; }
  const res = await plzLookup(v);
  if (plzEl.value.trim() !== v) return;
  plzEl._res = res;
  if (ortEl && res.names) {
    let dl = document.getElementById('plz-dl-' + ortEl.id);
    if (!dl) { dl = document.createElement('datalist'); dl.id = 'plz-dl-' + ortEl.id; document.body.appendChild(dl); ortEl.setAttribute('list', dl.id); }

function match(p){
  var f=state.f;
  if(state.typ!=='alle'&&allTyp(p).indexOf(state.typ)<0)return false;
  if(state.q){
    var hay=[p.vorname,p.nachname,p.plz,p.ort,p.notizen,p.agentur].concat(p.sprachen||[],p.fertigkeiten||[]).join(' ').toLowerCase();
    var toks=state.q.toLowerCase().split(/\s+/).filter(Boolean);
    for(var i=0;i<toks.length;i++){if(hay.indexOf(toks[i])<0)return false}
  }
  for(var gi=0;gi<GROUPS.length;gi++){
    var g=GROUPS[gi],s=f.sets[g.k];
    if(!s.size)continue;
    var v=p[g.field];
    if(g.multi){var arr=v||[];var ok=true;s.forEach(function(x){if(arr.indexOf(x)<0)ok=false});if(!ok)return false}
    else if(!s.has(v))return false;
  }
  for(var ri=0;ri<RANGES.length;ri++){
    var r=RANGES[ri],lo=num(f.r[r.k].min),hi=num(f.r[r.k].max);
    if(lo==null&&hi==null)continue;
    var val=r.get(p);
    if(val==null)return false;
    if(lo!=null&&val<lo)return false;
    if(hi!=null&&val>hi)return false;
  }
  if(f.plz&&String(p.plz||'').indexOf(f.plz)!==0)return false;
  if(f.dFrom){
    var dv=p.verfDates||[],days=daysBetween(f.dFrom,f.dTo);
    if(!days.length)return false;
    for(var di=0;di<days.length;di++){if(dv.indexOf(days[di])<0)return false}
  }
  var sp=num(f.spiel);
  if(sp!=null){
    var a=p.spielVon!=null?p.spielVon:ageOf(p);
    var b=p.spielBis!=null?p.spielBis:(p.spielVon!=null?p.spielVon:ageOf(p));
    if(a==null||b==null||sp<a||sp>b)return false;
  }
  if(f.t.foto&&!p.hasFoto)return false;
  if(f.t.brille&&!p.brille)return false;
  return true;
}
function sorter(){

  if(state.sort==='alter')return function(a,b){var x=ageOf(a),y=ageOf(b);return ((x==null?999:x)-(y==null?999:y))||byName(a,b)};

function loadImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){URL.revokeObjectURL(url);res(img)};
    img.onerror=function(){
      URL.revokeObjectURL(url);
      var fr=new FileReader();
      fr.onload=function(){var i2=new Image();i2.onload=function(){res(i2)};i2.onerror=function(){rej(new Error('decode'))};i2.src=fr.result};
      fr.onerror=function(){rej(new Error('read'))};
      fr.readAsDataURL(file);
    };
    img.src=url;
  });
}
function scaled(img,max,q){
  var s=Math.min(1,max/Math.max(img.width,img.height));
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}

async function persistPhotos(pid,old,rec){
  var edits=state.photoEdits,docs=state.photoDocs,finalThumbs={};
  for(var si=0;si<ALLSLOTS.length;si++){
    var k=ALLSLOTS[si].k,ed=edits[k];
    if(ed&&(ed.full||ed.remove)){
      if(ed.full){await db.doc('photos/'+pid+'/s/'+k).set({slot:k,thumb:ed.thumb,data:ed.full});finalThumbs[k]=ed.thumb}
      else await db.doc('photos/'+pid+'/s/'+k).delete();
    }else if(docs[k]){finalThumbs[k]=docs[k].thumb}
  }
  var fkeys=Object.keys(finalThumbs);
  var main=finalThumbs.portrait||finalThumbs.ganzkoerper||finalThumbs.profil||finalThumbs[fkeys[0]]||'';
  var anyRemove=Object.keys(edits).some(function(x){return edits[x].remove});
  if(!fkeys.length&&old&&old.hasFoto&&!Object.keys(docs).length&&!anyRemove)main=old.thumb||'';
  delete rec.hasFoto;delete rec.thumb;
  if(main||fkeys.length){rec.hasFoto=true;if(main)rec.thumb=main}
}

/* ---------- Kalender ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayStr(){return ymd(new Date())}
function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function isoWeek(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);
  var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-y)/86400000+1)/7);
}
function daysBetween(a,b){
  if(!b||b<a)b=a;
  var q=a.split('-'),d=new Date(+q[0],+q[1]-1,+q[2]),out=[];
  if(isNaN(d.getTime()))return out;
  for(var i=0;i<120;i++){var s=ymd(d);if(s>b)break;out.push(s);d.setDate(d.getDate()+1)}
  return out;
}
function nextFree(p){var t=todayStr();var a=(p.verfDates||[]).filter(function(x){return x>=t}).sort();return a[0]||null}
function fmtDM(s){return s.slice(8,10)+'.'+s.slice(5,7)+'.'}
function calDaysOfWeek(w){var st=weekStart(new Date()),out=[];for(var i=0;i<7;i++){var d=new Date(st);d.setDate(st.getDate()+w*7+i);out.push(ymd(d))}return out}
function kalAlter(p){
  if(!p.selbst)return null;
  if(!p.kalenderAt)return -1;
  return Math.floor((Date.now()-p.kalenderAt)/86400000);
}
function kalInfoHTML(p){
  var a=kalAlter(p);if(a===null)return '';
  if(a<0)return '<p class="warn" style="margin:0 0 8px">Der Kalender wurde noch nicht aktualisiert.</p>';
  var txt='Kalender zuletzt aktualisiert am '+new Date(p.kalenderAt).toLocaleDateString('de-DE')+'.';
  return a>30?'<p class="warn" style="margin:0 0 8px">'+txt+' Das ist über einen Monat her, die Angaben sind vielleicht veraltet.</p>':'<p class="cl" style="margin:0 0 8px">'+txt+'</p>';
}
function calHTML(p,editable){
  var set=new Set(p.verfDates||[]),today=todayStr();
  var start=weekStart(new Date()),end=new Date(start);
  end.setDate(end.getDate()+WEEKS*7-1);
  var startS=ymd(start),endS=ymd(end);
  var h='<div class="cal" id="cal">';
  var m=new Date(start.getFullYear(),start.getMonth(),1);
  while(m<=end){
    var y=m.getFullYear(),mo=m.getMonth(),last=new Date(y,mo+1,0);
    h+='<div class="calm"><div class="calt">'+MONTHS[mo]+' '+y+'</div><div class="calh"><span>KW</span>'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>';
    var ws=weekStart(new Date(y,mo,1));
    while(ws<=last){
      var cells='',days=[];
      for(var i=0;i<7;i++){
        var d=new Date(ws);d.setDate(ws.getDate()+i);
        var sd=ymd(d);
        if(d.getMonth()!==mo||sd<startS||sd>endS){cells+='<span class="cd gap" aria-hidden="true"></span>';continue}
        days.push(sd);
        var past=sd<today,on=set.has(sd)&&!past;
        cells+='<button type="button" class="cd'+(on?' on':'')+(past?' past':'')+(i>=5?' we':'')+(sd===today?' today':'')+'" data-act="calday" data-d="'+sd+'" aria-pressed="'+on+'" aria-label="'+d.getDate()+'. '+MONTHS[mo]+' '+y+(on?', verfügbar':'')+'"'+((past||!editable)?' disabled':'')+'>'+d.getDate()+'</button>';
      }
      if(days.length){
        h+='<div class="calr"><button type="button" class="kw" data-act="calweek" data-days="'+days.join(',')+'"'+(editable?'':' disabled')+' title="Alle Tage dieser Zeile umschalten">'+isoWeek(ws)+'</button>'+cells+'</div>';
      }
      ws.setDate(ws.getDate()+7);
    }
    h+='</div>';
    m=new Date(y,mo+1,1);
  }
  h+='</div><p class="cl calnote">Grün bedeutet verfügbar. '+(editable?'Tippe auf einen Tag, oder auf die Kalenderwoche links, um die Tage dieser Zeile umzuschalten. ':'')+'Der Kalender zeigt die laufende Woche und die nächsten 8 Wochen und rückt jeden Montag um eine Woche weiter.</p><div class="cl" id="calstat" role="status"></div>';
  return h;
}
function calSync(){
  var c=state.cal;
  Array.prototype.forEach.call(document.querySelectorAll('#cal button.cd'),function(b){
    var on=!!c&&c.set.has(b.dataset.d)&&!b.classList.contains('past');
    b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));
  });
}
function calStat(msg,bad){var el=$('#calstat');if(el){el.textContent=msg;el.style.color=bad?'var(--accent)':''}}
function calChanged(){

  calSync();

  calStat('Änderung wird gespeichert …');
  clearTimeout(c.timer);c.timer=setTimeout(function(){c.timer=null;saveCal(c)},700);

async function saveCal(c){
  if(c.busy){c.dirty=true;return}
  c.busy=true;c.dirty=false;
  try{
    await db.doc('people/'+c.id).update({verfDates:Array.from(c.set).sort(),kalenderAt:Date.now(),updatedAt:Date.now()});
    calStat('Verfügbarkeit gespeichert');
  }catch(e){calStat('Speichern hat nicht geklappt. Tippe noch einmal auf einen Tag.',true)}
  c.busy=false;
  if(c.dirty)saveCal(c);
}
function flushCal(){

}

async function saveProj(){
  var d=state.pdraft,err=$('#ferr'),btn=$('#psave');
  if(!d.name.trim()){err.textContent='Gib dem Projekt einen Namen.';$('#p-name').focus();return}
  var tage=[];
  d.tage.forEach(function(t){if(!t.von)return;var a=t.von,b=t.bis||t.von;if(b<a){var x=a;a=b;b=x}tage.push(b===a?{von:a}:{von:a,bis:b})});
  tage.sort(function(a,b){return a.von<b.von?-1:1});
  var rollen=d.rollen.map(function(r,i){
    var o={id:r.id||('r'+Date.now().toString(36)+i)};
    ROLEF.forEach(function(f){
      var v=String(r[f.k]||'').trim();if(!v)return;
      if(f.t==='num'){var n=num(v);if(n!=null)o[f.k]=n}
      else if(f.t==='list'){var a=v.split(',').map(function(s){return s.trim()}).filter(Boolean);if(a.length)o[f.k]=a}
      else o[f.k]=v;
    });
    return o;
  }).filter(function(o){return Object.keys(o).length>1});
  if(!isAdmin){
    var mp=[['produktion','p-prod','die Produktion'],['art','p-art','was gedreht wird'],['ort','p-ort','den Drehort'],['regieName','p-rn','die Ansprechperson'],['regieMail','p-rm','die E-Mail der Ansprechperson'],['regieTel','p-rt','die Telefonnummer der Ansprechperson']];
    for(var mi=0;mi<mp.length;mi++){if(!String(d[mp[mi][0]]||'').trim()){err.textContent='Bitte trage '+mp[mi][2]+' ein. Pflichtfelder sind mit * markiert.';var me=$('#'+mp[mi][1]);if(me)me.focus();return}}
  }
  if(String(d.regieTel||'').trim()){var pe2=phoneCheck(d.regieTel);if(pe2){err.textContent=pe2;var tf2=$('#p-rt');if(tf2)tf2.focus();return}}
  if(!tage.length){err.textContent='Trage mindestens einen Drehtag ein.';var tf=$('#pt-v0');if(tf)tf.focus();return}
  if(!rollen.length){err.textContent='Lege mindestens eine Rolle an und trage ihren Namen oder eine Anforderung ein.';return}
  err.textContent='';btn.disabled=true;btn.textContent='Speichert …';
  try{
    var old=d.id?curProj():null;
    var ref=d.id?db.doc('projekte/'+d.id):db.collection('projekte').doc();
    var rec={name:d.name.trim(),tage:tage,rollen:rollen,createdAt:old&&old.createdAt?old.createdAt:Date.now(),updatedAt:Date.now()};
    if(d.produktion.trim())rec.produktion=d.produktion.trim();
    if(d.art.trim())rec.art=d.art.trim();
    if(String(d.gage||'').trim())rec.gage=String(d.gage).trim();
    if(d.notiz.trim())rec.notiz=d.notiz.trim();
    if(d.regieName.trim())rec.regieName=d.regieName.trim();
    if(d.regieMail.trim())rec.regieMail=d.regieMail.trim();
    if(d.regieTel.trim())rec.regieTel=d.regieTel.trim();
    if(d.kundeId.trim())rec.kundeId=d.kundeId.trim();
    if(d.ort.trim())rec.ort=d.ort.trim();
    if(d.oeffentlich)rec.oeffentlich=true;
    if(old&&old.auswahl)rec.auswahl=old.auswahl;
    if(old&&old.kundeAntwortAt)rec.kundeAntwortAt=old.kundeAntwortAt;
    if(old&&old.adminGesehenAt)rec.adminGesehenAt=old.adminGesehenAt;
    if(isAdmin&&rec.kundeId&&!(old&&old.erstellerName)){var ku=state.users.filter(function(u){return u.id===rec.kundeId})[0];if(ku&&ku.name)rec.erstellerName=ku.name}
    if(role==='kunde'){rec.ersteller=uid;rec.kundeId=uid;rec.erstellerName=myName||myEmail;delete rec.oeffentlich;if(old&&old.oeffentlich)rec.oeffentlich=true}
    else if(old&&old.ersteller){rec.ersteller=old.ersteller;if(old.erstellerName)rec.erstellerName=old.erstellerName}
    await ref.set(rec);
    if(isAdmin)syncAusschreibung(ref.id,rec);
    state.pid=ref.id;state.roleSel='';if(isAdmin)state.pOpen=true;
    toast('Projekt gespeichert');
    closeSheet();
    state.projects=state.projects.filter(function(x){return x.id!==ref.id}).concat([Object.assign({id:ref.id},rec)]);
    if(state.view==='proj')renderProj();else if(state.view==='kunde')renderKunde();
  }catch(e){
    btn.disabled=false;btn.textContent='Speichern';
    err.textContent='Speichern hat nicht geklappt. Versuche es noch einmal.';
  }
}

async function anfragenHTML() {
  try {
    const qs = await be.db.collection('ausschreibung').get();
    const arr = qs.docs.map((d) => d.data() || {}).filter((a) => (a.rollen || []).length || (a.tage || []).length);
    arr.sort((a, b) => String(((a.tage || [])[0] || {}).von || '9').localeCompare(String(((b.tage || [])[0] || {}).von || '9')));
    if (!arr.length) return '';
    return '<div class="card2"><h2 style="font-size:26px">Aktuelle Anfragen</h2><p class="cl" style="margin:4px 0 12px">Dafür sucht die Agentur gerade Leute. Registriere dich, um mitzumachen.</p><div class="rolegrid">' + arr.map((a) => {
      const tg = (a.tage || []).filter((t) => t.von).map((t) => t.bis && t.bis !== t.von ? fmt(t.von) + ' – ' + fmt(t.bis) : fmt(t.von)).join(', ');
      return '<div class="role"><b>' + esc(tg || 'Termin offen') + '</b>' + (a.ort ? '<div class="cl">' + esc(a.ort) + '</div>' : '') + (a.rollen || []).map((r) => '<div style="margin-top:6px"><span class="pill">' + esc(r.typ || 'Rolle') + '</span> ' + (r.anzahl ? '<span class="cm">× ' + r.anzahl + '</span> ' : '') + esc(r.name || '') + '<div class="cl">' + esc((r.krit || []).filter((x) => x !== r.typ).join(' · ')) + (r.beschr ? ((r.krit || []).length ? ' · ' : '') + esc(r.beschr) : '') + '</div></div>').join('') + '</div>';
    }).join('') + '</div></div>';
  } catch (e) { return ''; }
}

        : '<div class="fld"><label for="a-vn">Vorname</label><input id="a-vn" autocomplete="given-name"></div><div class="fld"><label for="a-nn">Nachname</label><input id="a-nn" autocomplete="family-name"></div>';
    }
    h += '<div class="fld"><label for="a-mail">E-Mail</label><input id="a-mail" type="email" inputmode="email" autocomplete="email"></div><div class="fld"><label for="a-pw">Passwort</label><input id="a-pw" type="password" autocomplete="' + (step2 ? 'new-password' : 'current-password') + '"></div>' + (step2 ? '<div class="fld"><label for="a-pw2">Passwort wiederholen</label><input id="a-pw2" type="password" autocomplete="new-password"></div>' : '') + (step2 && !prod ? '<label class="consent" style="margin-top:12px"><input type="checkbox" id="a-news"><span>Ich möchte gelegentlich Neuigkeiten und Erinnerungen der Agentur per E-Mail erhalten (freiwillig, jederzeit widerrufbar).</span></label><label class="consent" style="margin-top:12px"><input type="checkbox" id="a-einw"><span>Ich willige ein, dass die Agentur meine Daten und Fotos speichert und zur Vermittlung an Produktionen nutzt (DSGVO). Ich kann mein Profil jederzeit ändern oder löschen.</span></label>' : '');
    h += '<div class="ferr" id="aerr" role="alert">' + (ok ? '' : esc(msg || '')) + '</div>' + (ok ? '<div class="okmsg" role="status">' + esc(msg) + '</div>' : '');
    h += '<div class="acts" style="margin-top:6px;border:0;padding:0"><button type="submit" class="btn primary" id="abtn">' + (step2 ? 'Konto anlegen' : 'Anmelden') + '</button>' + (step2 ? '' : '<button type="button" class="btn" id="areset">Passwort vergessen</button>') + '</div></form>';
  }
  if (be.mode === 'local') {
    h += '<div class="cl" style="margin-top:14px">Testmodus ohne Server. Schnell ausprobieren:</div><div class="demo"><button type="button" class="btn small" data-demo="u_admin">Als Agentur</button><button type="button" class="btn small" data-demo="u_bew">Als Bewerber</button><button type="button" class="btn small" data-demo="u_kunde">Als Kunde</button></div>';
  }
  h += '</div>';
  h += prod
    ? '<p class="cl" style="text-align:center;margin-top:16px">Du bist Komparse, Kleindarsteller oder Schauspieler? <a href="' + pageUrl('') + '">Zur Anmeldung für Darsteller</a></p>'
    : '<p class="cl" style="text-align:center;margin-top:16px">Du suchst Darsteller für eine Produktion? <a href="' + pageUrl('produktion') + '">Zum Bereich für Produktionen</a></p><div id="anfr"></div>';
  h += '<div class="foot"><a href="datenschutz.html">Datenschutz</a><a href="impressum.html">Impressum</a></div></div>';
  host.innerHTML = h; host.hidden = false; $('#app').hidden = true;
  if (!prod) anfragenHTML().then((x) => { const e = $('#anfr'); if (e) e.innerHTML = x; });
}

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t && t.name === 'kat') document.querySelectorAll('.subbox').forEach((b) => { b.hidden = b.dataset.for !== t.value; });
});
document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.m) { mode = t.dataset.m; renderAuth(); return; }
  if (t.id === 'aweiter') {
    const k = (document.querySelector('input[name=kat]:checked') || {}).value || '', err = $('#aerr');
    reg.kat = k; reg.tages = !!($('#r-tages') || {}).checked; reg.text = !!($('#r-text') || {}).checked; reg.ausb = !!($('#r-ausb') || {}).checked; reg.komp = !!($('#r-komp') || {}).checked; reg.kdopt = !!($('#r-kdopt') || {}).checked;
    if (!k) { err.textContent = 'Wähle, als was du dich eintragen möchtest.'; return; }
    if (k !== 'kd') { reg.tages = false; reg.text = false; }
    if (k !== 'schauspieler') { reg.ausb = false; reg.komp = false; reg.kdopt = false; }
    if (k === 'kd' && !reg.tages && !reg.text) { err.textContent = 'Wähle mindestens eine Erfahrung aus: Tagesrollen oder Textrollen.'; return; }
    if (k === 'schauspieler' && !reg.ausb) { err.textContent = 'Als Schauspieler brauchst du eine Schauspielausbildung. Ohne Ausbildung wähle Kleindarsteller oder Komparse.'; return; }
    mode = 'register2'; renderAuth(); return;
  }
  if (t.dataset && t.dataset.demo) { await be.signIn('', '', t.dataset.demo); location.reload(); return; }
  if (t.id === 'areset') {
    const m = $('#a-mail').value.trim();
    if (!m) { $('#aerr').textContent = 'Trage zuerst deine E-Mail ein.'; return; }
    try { await be.reset(m); renderAuth('Wir haben dir eine E-Mail zum Zurücksetzen geschickt, falls es das Konto gibt.', true); } catch (x) { $('#aerr').textContent = errText(x); }
  }
  if (t.dataset && t.dataset.act === 'logout') { try { await be.signOut(); } catch (x) {} location.reload(); }
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'aform') return;
  e.preventDefault();
  const mail = $('#a-mail').value.trim(), pw = $('#a-pw').value, err = $('#aerr'), btn = $('#abtn');
  if (!mail || !pw) { err.textContent = 'Trage E-Mail und Passwort ein.'; return; }
  btn.disabled = true;
  try {
    if (mode !== 'login') {
      let name, vn = '', nn = '';
      if (prod) name = $('#a-name').value.trim();
      else { vn = $('#a-vn').value.trim(); nn = $('#a-nn').value.trim(); name = (vn + ' ' + nn).trim(); }
      if (prod ? !name : !vn || !nn) { err.textContent = prod ? 'Trage den Namen der Ansprechperson ein.' : 'Trage Vorname und Nachname ein.'; btn.disabled = false; return; }
      if (!prod && !($('#a-einw') || {}).checked) { err.textContent = 'Ohne deine Einwilligung zur Datenverarbeitung können wir dich nicht eintragen.'; btn.disabled = false; return; }
      if (pw.length < 8) { err.textContent = 'Das Passwort ist zu kurz. Nimm mindestens 8 Zeichen.'; btn.disabled = false; return; }
      if (pw !== $('#a-pw2').value) { err.textContent = 'Die beiden Passwörter stimmen nicht überein.'; btn.disabled = false; return; }
      let prodReg = null;
      if (prod) {
        prodReg = { firma: $('#a-firma').value.trim(), strasse: $('#a-str').value.trim(), plz: $('#a-plz').value.trim(), ort: $('#a-ort').value.trim(), telefon: $('#a-tel').value.trim() };
        const miss = [['firma', 'die Firma oder Agentur'], ['strasse', 'Straße und Hausnummer'], ['plz', 'die Postleitzahl'], ['ort', 'die Stadt'], ['telefon', 'die Telefonnummer']].filter((x) => !prodReg[x[0]])[0];
        if (miss) { err.textContent = 'Bitte trage ' + miss[1] + ' ein. Wir prüfen jedes Produktionskonto vor der Freigabe.'; btn.disabled = false; return; }
        const pe = phoneCheck(prodReg.telefon);
        if (pe) { err.textContent = pe; btn.disabled = false; $('#a-tel').focus(); return; }
        err.textContent = 'Prüfe Postleitzahl …';
        const ge = await plzGate(prodReg.plz);
        err.textContent = '';
        if (ge) { err.textContent = ge; btn.disabled = false; $('#a-plz').focus(); return; }
      }
      const rg = prod ? prodReg : Object.assign(buildReg(), { vorname: vn, nachname: nn, einwilligung: true, news: !!($('#a-news') || {}).checked });
      await be.register(mail, pw, name, prod ? 'kunde' : 'bewerber', rg);
      if (be.mode === 'local') location.reload();
    } else {
      await be.signIn(mail, pw);
      if (be.mode === 'local') location.reload();
    }
  } catch (x) { err.textContent = errText(x); btn.disabled = false; }
});

function renderWait(info) {
  const wait = info.freigabe === 'offen';
  $('#auth').innerHTML = '<div class="auth"><img class="logo-big" src="' + LOGO + '" alt="Logo"><h1>Casting-Kartei</h1><p class="sub" style="margin-top:8px">Für Produktionen und Regie</p><div class="card2"><h2 style="font-size:22px;margin:0 0 8px">' + (wait ? 'Dein Konto wird geprüft' : 'Konto nicht freigeschaltet') + '</h2><p>' + (wait ? 'Danke für deine Registrierung, ' + esc(info.name || '') + '. Sobald die Agentur dein Konto freigeschaltet hat, kannst du Projekte anlegen. Schau später noch einmal vorbei.' : 'Dein Konto wurde nicht freigeschaltet. Bitte melde dich bei der Agentur.') + '</p><div class="acts" style="border:0;padding:0">' + (wait ? '<button type="button" class="btn primary" onclick="location.reload()">Neu laden</button>' : '') + '<button type="button" class="btn" data-act="logout">Abmelden</button></div></div><div class="foot"><a href="datenschutz.html">Datenschutz</a><a href="impressum.html">Impressum</a></div></div>';
  $('#auth').hidden = false; $('#app').hidden = true;
}

function renderBlocked(info) {
  $('#auth').innerHTML = '<div class="auth"><img class="logo-big" src="' + LOGO + '" alt="Logo"><h1>Casting-Kartei</h1><div class="card2"><h2 style="font-size:22px;margin:0 0 8px">' + (info.geloescht ? 'Konto gelöscht' : 'Konto gesperrt') + '</h2><p class="cl">' + (info.geloescht ? 'Dieses Konto und die zugehörigen Daten wurden gelöscht.' : 'Der Zugang zu diesem Konto ist gesperrt. Wende dich bei Fragen an die Agentur.') + '</p><div class="acts" style="border:0;padding:0;margin-top:12px"><button type="button" class="btn" data-act="logout">Abmelden</button></div></div></div>';
  $('#auth').hidden = false; $('#app').hidden = true;
}

async function boot() {
  try { be = await createBackend(); } catch (e) {
    $('#auth').innerHTML = '<div class="auth"><h1>Casting-Kartei</h1><p class="ferr">Die Verbindung zum Server ist fehlgeschlagen. Prüfe dein Internet und lade die Seite neu.</p></div>';
    $('#auth').hidden = false; return;
  }
  be.onAuth((info) => {
    if (!info) { if (started) location.reload(); else renderAuth(); return; }
    if (!info.role) { renderAuth('Zu diesem Konto fehlt die Rolle. Bitte melde dich ab und registriere dich neu.'); be.signOut(); return; }
    if (info.gesperrt) { renderBlocked(info); return; }
    if (info.role === 'kunde' && info.freigabe && info.freigabe !== 'ok') { renderWait(info); return; }
    if (started) return;
    started = true;
    $('#auth').hidden = true; $('#app').hidden = false;
    runApp({ db: be.db, role: info.role, uid: info.uid, name: info.name, email: info.email, reg: info.reg, deleteAccount: be.deleteAccount, changePassword: be.changePassword, loeschantrag: info.loeschantrag, mode: be.mode });
  });
}
boot();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

/* Großschreibung mit CSS macht aus ß ein SS (Maße wird MASSE). In den Großbuchstaben-Überschriften nehmen wir stattdessen das große ẞ. */
(function () {
  const SEL = 'legend,.fl,.fld label,.fr label,dl.facts dt,.sec h3,.pill,.pl,.sh h2,.role b,.mh,.calt,.top h1,.auth h1';
  let busy = false;
  function fix() {
    busy = false;
    document.querySelectorAll(SEL).forEach((el) => {
      const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = w.nextNode())) { if (n.nodeValue.indexOf('ß') >= 0) n.nodeValue = n.nodeValue.replace(/ß/g, 'ẞ'); }
    });
  }
  new MutationObserver(() => { if (!busy) { busy = true; requestAnimationFrame(fix); } }).observe(document.documentElement, { childList: true, subtree: true });
  fix();
})();
</script>
